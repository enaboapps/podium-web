<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Podium audience display</title>
  <style>
    html,body { margin:0;height:100%;background:#09090b;color:white;overflow:hidden; }
    #audience-root { height:100%;display:flex;flex-direction:column; }
  </style>
</head>
<body>
  <div id="audience-root"></div>
  <script>
    if (window.opener) window.opener.postMessage('podium-audience-ready', window.location.origin);
    else document.getElementById('audience-root').textContent = 'Open the audience window from your talk in Podium.';
  </script>
</body>
</html>
